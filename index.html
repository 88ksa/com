        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;

            --dark: #0f172a;

            --border-color: rgba(255, 255, 255, 0.1);
            --light: #f8fafc;
        }

        * {

            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {

            color: var(--light);

        }

        .container {

            margin: 0 auto;
        }

        header {

            border-radius: 16px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

            padding: 10px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
